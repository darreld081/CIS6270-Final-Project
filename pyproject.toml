[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cis6270-dfm"
version = "0.1.0"
description = "Masked discrete flow matching for K562 regulatory DNA"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "pytorch-lightning",
    "numpy",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cis6270-dfm"
version = "0.1.0"
description = "Masked discrete flow matching for K562 regulatory DNA"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "pytorch-lightning",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*does not have many workers.*:UserWarning",
    "ignore:.*trainer. reference is not registered.*:UserWarning",
    "ignore:.*LeafSpec.*:FutureWarning",
]
